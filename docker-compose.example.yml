services:
  verificaai-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: verificaai-api
    env_file:
      - ./.env
      - ./.env.transcricao
      - ./.env.fetch-site
    networks:
      - proxy
    ports:
      - "8001:8000"
    environment:
      TZ: ${APP_TZ}
      REDIS_URL: redis://verificaai-redis:6379/0
      PYTHONPATH: /app/src
    volumes:
      - ./.env:/app/.env
      - ./.env.transcricao:/app/.env.transcricao
      - ./.env.fetch-site:/app/.env.fetch-site
      - ./db:/app/db
    depends_on:
      - verificaai-redis
    restart: unless-stopped

  verificaai-worker:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ./.env
      - ./.env.qdrant
      - ./.env.transcricao
      - ./.env.fetch-site
    networks:
      - proxy
    environment:
      TZ: ${APP_TZ}
      REDIS_URL: redis://verificaai-redis:6379/0
      PYTHONPATH: /app/src
    volumes:
      - ./.env:/app/.env
      - ./.env.qdrant:/app/.env.qdrant
      - ./.env.transcricao:/app/.env.transcricao
      - ./.env.fetch-site:/app/.env.fetch-site
      - ./gcs-service-account.json:/run/secrets/gcs-service-account.json:ro
      - ./db:/app/db
    depends_on:
      - verificaai-redis
    command: ["/bin/sh", "-c", "exec uv run python -m workers.analysis"]
    deploy:
      replicas: 3
    restart: unless-stopped

  verificaai-painel-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: verificaai-painel-worker
    env_file:
      - ./.env
      - ./.env.painel-api
    networks:
      - proxy
    environment:
      TZ: ${APP_TZ}
      REDIS_URL: redis://verificaai-redis:6379/0
      PYTHONPATH: /app/src
    volumes:
      - ./.env:/app/.env
      - ./.env.painel-api:/app/.env.painel-api
    depends_on:
      - verificaai-redis
    command: ["/bin/sh", "-c", "exec uv run python -m workers.verificaai_painel"]
    restart: unless-stopped

  verificaai-qdrant-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: verificaai-qdrant-worker
    env_file:
      - ./.env
      - ./.env.qdrant
    networks:
      - proxy
    environment:
      TZ: ${APP_TZ}
      REDIS_URL: redis://verificaai-redis:6379/0
      PYTHONPATH: /app/src
    volumes:
      - ./.env:/app/.env
      - ./.env.qdrant:/app/.env.qdrant
    depends_on:
      - verificaai-redis
    command: ["/bin/sh", "-c", "exec uv run python -m workers.qdrant"]
    restart: unless-stopped

  verificaai-redis:
    image: redis:7
    container_name: verificaai-redis
    networks:
      - proxy
    restart: unless-stopped
    volumes:
      - verificaai_redis_data:/data

networks:
  proxy:
    external: true

volumes:
  verificaai_redis_data:
